<text x="24" y="757" font-size="10.5" fill="#5A6673">Les associations « a obtenu » et « appartient à » portent leurs propres attributs : date d’obtention et</text>
<text x="24" y="772" font-size="10.5" fill="#5A6673">autorité pour un grade, période de début et de fin pour une catégorie de poids. Elles deviennent donc</text>
<text x="24" y="787" font-size="10.5" fill="#5A6673">des tables à part entière dans le modèle logique.</text>
<text x="24" y="802" font-size="10.5" fill="#5A6673">Le type de la DISCIPLINE commande la présence des grades et des catégories : un sport collectif n’en a pas.</text>
