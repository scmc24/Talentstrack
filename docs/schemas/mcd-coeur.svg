<text x="24" y="642" font-size="10.5" fill="#5A6673">Les attributs soulignés sont les identifiants.</text>
<text x="24" y="657" font-size="10.5" fill="#5A6673">La TRANSITION est une entité à part entière et non un attribut de l’ÉTAPE : elle porte le mode d’arrivée,</text>
<text x="24" y="672" font-size="10.5" fill="#5A6673">information que ni l’étape précédente ni la suivante ne contiennent.</text>
<text x="24" y="687" font-size="10.5" fill="#5A6673">Chaque ÉTAPE conserve son UNITÉ ADMINISTRATIVE au moment où elle s’est déroulée, indépendamment</text>
<text x="24" y="702" font-size="10.5" fill="#5A6673">de l’adresse actuelle de la structure.</text>
